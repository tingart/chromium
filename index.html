<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Remote Chromium</title><style>
:root{--bg:#111318;--panel:#1b1e25;--panel2:#242832;--line:#353a46;--text:#f4f5f7;--muted:#9ca3af;--ui:1}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}body{font-size:calc(14px * var(--ui))}button,input,select{font:inherit}button{border:0;border-radius:10px;background:var(--panel2);color:var(--text);padding:9px 12px;white-space:nowrap}button:active{transform:scale(.97)}.hidden{display:none!important}.login{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:22px}.loginbox{width:min(390px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 50px #0008}.loginbox h1{margin:0 0 8px;font-size:24px}.loginbox p{margin:0 0 20px;color:var(--muted);font-size:14px}.loginbox input{width:100%;margin:7px 0;padding:13px;border-radius:10px;border:1px solid var(--line);background:#101218;color:var(--text);outline:none}.loginbox button{width:100%;margin-top:10px;background:#3a4150}.err{min-height:20px;margin-top:10px;color:#ff8b8b;font-size:13px}.app{height:100%;display:flex;flex-direction:column}.top,.toolbar{display:flex;align-items:center;gap:6px;padding:6px;background:#0d0f13;border-bottom:1px solid var(--line);overflow-x:auto}.top{min-height:54px}.toolbar{min-height:44px}.url{flex:1;min-width:120px;background:#171a20;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);outline:none}.tabs{display:flex;gap:5px;overflow:auto;padding:5px;background:#0d0f13;border-bottom:1px solid var(--line)}.tab{white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;padding:8px 11px}.tab.active{background:#3a4150}.screenwrap{position:relative;flex:1;min-height:0;background:#08090b;display:flex;align-items:center;justify-content:center;overflow:hidden}.screen{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;image-rendering:auto}.touch{position:absolute;inset:0;touch-action:none}.bottom{display:flex;gap:6px;overflow:auto;padding:7px;background:#0d0f13;border-top:1px solid var(--line)}.panel{position:absolute;z-index:20;right:8px;top:105px;width:min(390px,calc(100% - 16px));max-height:calc(100% - 115px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 15px 50px #0009}.panel h3{margin:3px 0 12px}.row{display:flex;gap:7px;align-items:center;margin:7px 0}.row>*{flex:1}.small{font-size:12px;color:var(--muted)}.range{width:100%}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;color:#cbd5e1}.danger{background:#542b31}.ok{color:#9ee6a8}.warn{color:#ffd27d}.section{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin:6px 0}.select{width:100%;background:#101218;color:var(--text);border:1px solid var(--line);padding:9px;border-radius:9px}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h1>Remote Chromium</h1><p>Private browser access</p><input id="username" autocomplete="username" placeholder="Username"><input id="password" autocomplete="current-password" type="password" placeholder="Password"><button id="loginBtn">Login</button><div id="loginErr" class="err"></div></div></div>
<div id="app" class="app hidden"><div class="top"><button id="back">←</button><button id="forward">→</button><button id="reload">↻</button><button id="home">⌂</button><button id="stop">×</button><input id="url" class="url" placeholder="Search or enter URL"><button id="go">Go</button><button id="logout" class="danger">Logout</button></div>
<div class="toolbar"><button id="newTabTop">＋ Tab</button><button id="closeTabTop">Close</button><button id="copyTop">Copy</button><button id="cutTop">Cut</button><button id="pasteTop">Paste</button><button id="keyTop">Keyboard</button><button id="menuTop">☰ Menu</button></div>
<div id="tabs" class="tabs"></div><div class="screenwrap"><img id="screenStream" class="screen"><div id="touchLayer" class="touch"></div>
<div id="panel" class="panel hidden"><h3>Browser Menu</h3><div class="row"><button id="newTab">New tab</button><button id="closeTab">Close tab</button></div><div class="row"><button id="copy">Copy</button><button id="cut">Cut</button><button id="paste">Paste</button></div><div class="row"><button id="rightClick">Right click</button><button id="doubleClick">Double click</button></div><div class="row"><button id="scrollUp">Scroll ↑</button><button id="scrollDown">Scroll ↓</button></div>
<div class="section"><b>Local display scaling</b><div class="label"><span>UI scale</span><span id="uiScaleValue">100%</span></div><input id="uiScale" class="range" type="range" min="35" max="150" value="100"><div class="label"><span>Stream width</span><span id="widthValue">854</span></div><input id="streamWidth" class="range" type="range" min="320" max="1280" value="854"><div class="label"><span>Stream height</span><span id="heightValue">480</span></div><input id="streamHeight" class="range" type="range" min="240" max="900" value="480"></div>
<div class="section"><b>Chromium page scaling</b><div class="label"><span>Chromium zoom</span><span id="chromeZoomValue">100%</span></div><input id="chromeZoom" class="range" type="range" min="25" max="200" value="100"><div class="small">Ye actual remote Chromium page ko scale karta hai. 25% tak chhota kar sakte ho.</div></div><div class="section"><b>Stream quality</b><div class="row"><select id="format" class="select"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="webp">WebP</option></select><input id="quality" type="number" min="10" max="100" value="70" placeholder="Quality"></div><div class="label"><span>Frame interval</span><span id="intervalValue">180 ms</span></div><input id="interval" class="range" type="range" min="30" max="1000" value="180"></div>
<div class="section"><div class="row"><button id="backup">Backup now</button><button id="restore">Restore</button></div><div id="cloud" class="small"></div></div><div class="section"><div class="row"><button id="debug">Debug</button><button id="full">Fullscreen</button></div><button id="logout2" class="danger" style="width:100%">Logout</button><pre id="debugOut"></pre></div></div></div>
<div class="bottom"><button id="menu">☰</button><button id="keyBtn">Keyboard</button><button id="fullBottom">Fullscreen</button><span id="status" class="small" style="padding:9px">Connecting…</span></div></div>
<script>
const $=id=>document.getElementById(id);const login=$('login'),app=$('app'),err=$('loginErr'),status=$('status'),screenStream=$('screenStream'),touch=$('touchLayer'),panel=$('panel'),url=$('url');let started=false,timers=[];
async function api(path,opt={}){const r=await fetch(path,{cache:'no-store',credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});if(r.status===401){showLogin();throw new Error('Authentication required')}return r}
function showLogin(){app.classList.add('hidden');login.classList.remove('hidden');screenStream.removeAttribute('src');started=false;timers.forEach(clearInterval);timers=[]}function showApp(){login.classList.add('hidden');app.classList.remove('hidden');start()}
async function checkAuth(){try{const r=await fetch('/auth/status',{cache:'no-store',credentials:'same-origin'});const x=await r.json();x.authenticated?showApp():showLogin()}catch(e){showLogin()}}
$('loginBtn').onclick=async()=>{err.textContent='';try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value}),credentials:'same-origin'});const x=await r.json();if(!r.ok)throw new Error(x.message||'Login failed');showApp()}catch(e){err.textContent=e.message}};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('username').onkeydown=e=>{if(e.key==='Enter')$('password').focus()};
async function logout(){try{await fetch('/logout',{method:'POST',credentials:'same-origin'})}catch(e){}showLogin()};$('logout').onclick=logout;$('logout2').onclick=logout;
function setStatus(x){status.textContent=x}async function post(p,b={}){return api(p,{method:'POST',body:JSON.stringify(b)})}
async function refreshTabs(){try{const x=await(await api('/tabs')).json();$('tabs').innerHTML='';x.tabs.forEach((t,i)=>{const b=document.createElement('button');b.className='tab'+(i===x.active_index?' active':'');b.textContent=t.title||'New Tab';b.onclick=async()=>{await post('/tabs/switch',{index:i});refreshTabs()};$('tabs').appendChild(b)});if(x.tabs[x.active_index])url.value=x.tabs[x.active_index].url==='about:blank'?'':x.tabs[x.active_index].url}catch(e){}}
async function nav(){const v=url.value.trim();if(!v)return;setStatus('Loading…');try{const x=await(await post('/navigate',{url:v})).json();if(x.url)url.value=x.url;setStatus('Ready');refreshTabs()}catch(e){setStatus(e.message)}}$('go').onclick=nav;url.onkeydown=e=>{if(e.key==='Enter')nav()};$('back').onclick=()=>post('/history/back');$('forward').onclick=()=>post('/history/forward');$('reload').onclick=()=>post('/reload');$('home').onclick=()=>post('/home');$('stop').onclick=()=>post('/stop');
async function newTab(){await post('/tabs/new');refreshTabs()}async function closeTab(){await post('/tabs/close',{index:0});refreshTabs()}$('newTab').onclick=newTab;$('newTabTop').onclick=newTab;$('closeTab').onclick=closeTab;$('closeTabTop').onclick=closeTab;
function coords(e){const r=touch.getBoundingClientRect();return{x:(e.clientX-r.left)*854/r.width,y:(e.clientY-r.top)*480/r.height}}touch.onpointerdown=e=>{touch._p={...coords(e),sx:e.clientX,sy:e.clientY};touch.setPointerCapture?.(e.pointerId)};touch.onpointerup=async e=>{if(!touch._p)return;const p=touch._p,c=coords(e),dx=e.clientX-p.sx,dy=e.clientY-p.sy;if(Math.abs(dx)>12||Math.abs(dy)>12)await post('/touch',{x:c.x,y:c.y,action:'scroll',delta_x:-dx*3,delta_y:-dy*3});else await post('/touch',{x:p.x,y:p.y,action:'click'});touch._p=null};touch.oncontextmenu=e=>e.preventDefault();screenStream.oncontextmenu=e=>e.preventDefault();
$('rightClick').onclick=()=>post('/touch',{x:427,y:240,action:'right_click'});$('doubleClick').onclick=()=>post('/touch',{x:427,y:240,action:'double_click'});$('scrollUp').onclick=()=>post('/touch',{x:427,y:240,action:'scroll',delta_y:-700});$('scrollDown').onclick=()=>post('/touch',{x:427,y:240,action:'scroll',delta_y:700});
async function copy(){try{const x=await(await api('/selection')).json();await navigator.clipboard.writeText(x.text||'');setStatus('Copied')}catch(e){setStatus('Copy failed')}}async function cut(){try{const x=await(await post('/cut')).json();await navigator.clipboard.writeText(x.text||'');setStatus('Cut')}catch(e){}}async function paste(){try{const t=await navigator.clipboard.readText();await post('/type',{text:t})}catch(e){setStatus('Paste failed')}}async function keyboard(){const k=prompt('Key (e.g. Enter, Escape, Control+A):');if(k)await post('/key',{key:k})}$('copy').onclick=copy;$('copyTop').onclick=copy;$('cut').onclick=cut;$('cutTop').onclick=cut;$('paste').onclick=paste;$('pasteTop').onclick=paste;$('keyBtn').onclick=keyboard;$('keyTop').onclick=keyboard;
async function saveSettings(){try{await post('/settings',{format:$('format').value,quality:+$('quality').value,interval:+$('interval').value,width:+$('streamWidth').value,height:+$('streamHeight').value,chromium_zoom:+$('chromeZoom').value/100});setStatus('Display settings saved')}catch(e){setStatus(e.message)}}
$('chromeZoom').oninput=()=>{$('chromeZoomValue').textContent=$('chromeZoom').value+'%'};$('chromeZoom').onchange=saveSettings;$('format').onchange=saveSettings;$('quality').onchange=saveSettings;$('interval').oninput=()=>{$('intervalValue').textContent=$('interval').value+' ms'};$('interval').onchange=saveSettings;$('streamWidth').oninput=()=>{$('widthValue').textContent=$('streamWidth').value};$('streamHeight').oninput=()=>{$('heightValue').textContent=$('streamHeight').value};$('streamWidth').onchange=saveSettings;$('streamHeight').onchange=saveSettings;
$('uiScale').oninput=e=>{const v=e.target.value;$('uiScaleValue').textContent=v+'%';document.documentElement.style.setProperty('--ui',v/100);localStorage.setItem('remote_ui_scale',v)};(()=>{const v=localStorage.getItem('remote_ui_scale')||'100';$('uiScale').value=v;$('uiScaleValue').textContent=v+'%';document.documentElement.style.setProperty('--ui',v/100)})();
$('backup').onclick=async()=>{setStatus('Backup started…');try{const x=await(await post('/backup')).json();setStatus(x.message||'Backup started');setTimeout(cloud,1500)}catch(e){setStatus(e.message)}};$('restore').onclick=async()=>{if(!confirm('Restore the browser profile from the latest cloud backup?'))return;setStatus('Restoring…');try{const x=await(await post('/restore')).json();setStatus(x.message||'Restore finished');setTimeout(()=>location.reload(),700)}catch(e){setStatus(e.message)}};
async function cloud(){try{const x=await(await api('/backup/status')).json();$('cloud').textContent='Cloud: '+(x.cloud_backup_exists?'backup available':'no backup yet')+' | Last backup: '+(x.last_backup||'never')+(x.last_restore?' | Restored: '+x.last_restore:'')+(x.last_error?' | Error: '+x.last_error:'')}catch(e){}}
$('debug').onclick=async()=>{try{$('debugOut').textContent=JSON.stringify(await(await api('/stats')).json(),null,2)+'\n\n'+JSON.stringify(await(await api('/backup/status')).json(),null,2)}catch(e){$('debugOut').textContent=e.message}};function toggleMenu(){panel.classList.toggle('hidden')}$('menu').onclick=toggleMenu;$('menuTop').onclick=toggleMenu;$('full').onclick=()=>document.documentElement.requestFullscreen?.();$('fullBottom').onclick=()=>document.documentElement.requestFullscreen?.();
async function loadSettings(){try{const x=await(await api('/settings')).json();const s=x.settings;$('format').value=s.format;$('quality').value=s.quality;$('interval').value=s.interval;$('intervalValue').textContent=s.interval+' ms';$('streamWidth').value=s.width;$('widthValue').textContent=s.width;$('streamHeight').value=s.height;$('heightValue').textContent=s.height;if(s.chromium_zoom){$('chromeZoom').value=Math.round(s.chromium_zoom*100);$('chromeZoomValue').textContent=Math.round(s.chromium_zoom*100)+'%'}}catch(e){}}
function start(){if(started)return;started=true;screenStream.src='/screen?ts='+Date.now();loadSettings();refreshTabs();cloud();setStatus('Connected');timers=[setInterval(refreshTabs,3000),setInterval(cloud,5000)]}checkAuth();
</script></body></html>
