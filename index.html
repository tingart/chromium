<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Desktop Remote Experience</title>
  <style>
    * {
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      touch-action: none !important;
      box-sizing: border-box;
      margin: 0; padding: 0;
    }

    body, html {
      width: 100%; height: 100%;
      background: #0f0f12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .browser-header {
      height: 48px;
      background: #18181c;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 8px;
      border-bottom: 1px solid #2a2a30;
    }

    .tabs-container {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      max-width: 45%;
    }

    .tab-item {
      background: #232328;
      padding: 4px 10px;
      border-radius: 6px 6px 0 0;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .tab-item.active { background: #3b82f6; }
    .tab-close { cursor: pointer; font-weight: bold; margin-left: 4px; }

    .url-bar {
      flex: 1;
      display: flex;
      gap: 4px;
    }

    .url-input {
      width: 100%;
      background: #0f0f12;
      border: 1px solid #333;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      -webkit-user-select: text !important;
      user-select: text !important;
      touch-action: auto !important;
    }

    .vnc-dock {
      position: fixed;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(24, 24, 28, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10000;
    }

    .dock-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #2a2a30;
      color: #fff;
      border: none;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dock-btn.active { background: #3b82f6; }

    #viewport {
      width: 100%;
      height: calc(100vh - 48px);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #screenStream {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="browser-header">
    <div class="tabs-container" id="tabsList"></div>
    <button onclick="addTab()" style="background:none; border:none; color:#fff; font-size:18px; padding:0 6px;">+</button>
    <div class="url-bar">
      <input type="text" id="urlInput" class="url-input" placeholder="Search or type web address" />
      <button onclick="triggerNavigate()" style="padding:0 12px; background:#3b82f6; border:none; color:#fff; border-radius:6px; font-weight:bold;">Go</button>
    </div>
  </div>

  <div id="viewport">
    <img id="screenStream" src="/screen" alt="Live Browser Stream" />
  </div>

  <div class="vnc-dock">
    <button class="dock-btn" onclick="toggleFullscreen()">⛶</button>
    <button class="dock-btn" id="rightClickBtn" onclick="toggleMode('rightClick')">🖱️</button>
    <button class="dock-btn" id="scrollBtn" onclick="toggleMode('scroll')">📜</button>
    <button class="dock-btn" id="kbBtn" onclick="toggleKeyboard()">⌨️</button>
  </div>

  <input type="text" id="manualKeyboardInput" style="position:absolute; opacity:0; pointer-events:none;" />

<script>
  const API_BASE = window.location.origin;
  let tabs = [];
  let activeTabIndex = 0;
  let currentMode = 'normal';
  let touchTimer = null;
  let touchStartPos = { x: 0, y: 0 };
  const kbInput = document.getElementById('manualKeyboardInput');

  window.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); return false; };

  async function fetchTabs() {
    try {
      const res = await fetch(`${API_BASE}/tabs`);
      const data = await res.json();
      tabs = data.tabs;
      activeTabIndex = data.active_index;
      renderTabs();
    } catch (e) { console.error(e); }
  }

  function renderTabs() {
    const list = document.getElementById('tabsList');
    list.innerHTML = '';
    tabs.forEach((tab, index) => {
      const el = document.createElement('div');
      el.className = `tab-item ${index === activeTabIndex ? 'active' : ''}`;
      el.innerHTML = `
        <span onclick="switchTab(${index})">${index + 1}. ${(tab.title || 'Tab').substring(0, 8)}</span>
        <span class="tab-close" onclick="closeTab(${index})">×</span>
      `;
      list.appendChild(el);
    });
    if (tabs[activeTabIndex]) {
      document.getElementById('urlInput').value = tabs[activeTabIndex].url;
    }
  }

  async function triggerNavigate() {
    const url = document.getElementById('urlInput').value;
    await fetch(`${API_BASE}/navigate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: url })
    });
    fetchTabs();
  }

  async function addTab() {
    await fetch(`${API_BASE}/tabs/new`, { method: 'POST' });
    fetchTabs();
  }

  async function switchTab(idx) {
    await fetch(`${API_BASE}/tabs/switch`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ index: idx })
    });
    fetchTabs();
  }

  async function closeTab(idx) {
    await fetch(`${API_BASE}/tabs/close`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ index: idx })
    });
    fetchTabs();
  }

  function toggleMode(mode) {
    currentMode = (currentMode === mode) ? 'normal' : mode;
    document.getElementById('rightClickBtn').classList.toggle('active', currentMode === 'rightClick');
    document.getElementById('scrollBtn').classList.toggle('active', currentMode === 'scroll');
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  function toggleKeyboard() {
    if (document.activeElement === kbInput) {
      kbInput.blur();
      document.getElementById('kbBtn').classList.remove('active');
    } else {
      kbInput.focus();
      document.getElementById('kbBtn').classList.add('active');
    }
  }

  const screenImg = document.getElementById('screenStream');

  // Updated 854x480 coordinate touch mapping
  screenImg.addEventListener('touchstart', (e) => {
    const rect = screenImg.getBoundingClientRect();
    const touch = e.touches[0];
    
    const scaleX = 854 / rect.width;
    const scaleY = 480 / rect.height;

    touchStartPos = {
      x: Math.round((touch.clientX - rect.left) * scaleX),
      y: Math.round((touch.clientY - rect.top) * scaleY)
    };

    touchTimer = setTimeout(() => {
      sendTouchEvent(touchStartPos.x, touchStartPos.y, 'right_click');
      touchTimer = null;
    }, 600);
  });

  screenImg.addEventListener('touchmove', (e) => {
    if (touchTimer) clearTimeout(touchTimer);
    if (currentMode === 'scroll') {
      const touch = e.touches[0];
      const rect = screenImg.getBoundingClientRect();
      const currentY = (touch.clientY - rect.top) * (480 / rect.height);
      const deltaY = touchStartPos.y - currentY;
      
      const action = deltaY > 0 ? 'scroll_down' : 'scroll_up';
      sendTouchEvent(touchStartPos.x, touchStartPos.y, action);
      touchStartPos.y = currentY;
    }
  });

  screenImg.addEventListener('touchend', (e) => {
    if (touchTimer) {
      clearTimeout(touchTimer);
      const action = (currentMode === 'rightClick') ? 'right_click' : 'click';
      sendTouchEvent(touchStartPos.x, touchStartPos.y, action);
      if (currentMode === 'rightClick') toggleMode('normal');
    }
  });

  async function sendTouchEvent(x, y, actionType) {
    await fetch(`${API_BASE}/touch`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ x: x, y: y, action: actionType })
    });
  }

  kbInput.addEventListener('keydown', async (e) => {
    if (e.key === 'Backspace' || e.key === 'Enter') {
      await fetch(`${API_BASE}/key`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: e.key })
      });
    }
  });

  kbInput.addEventListener('input', async (e) => {
    const val = e.target.value;
    if (val.length > 0) {
      const char = val.slice(-1);
      await fetch(`${API_BASE}/key`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: char })
      });
      e.target.value = '';
    }
  });

  fetchTabs();
</script>
</body>
</html>
