<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Remote Chromium</title><style>
:root{--ui-scale:1;--header-h:54px;--bg:#111318;--panel:#1b1e25;--panel2:#242832;--line:#353a46;--text:#f4f5f7;--muted:#9ca3af}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input{font:inherit}button{color:var(--text);border:1px solid var(--line);background:var(--panel2);border-radius:10px;min-height:36px;padding:0 11px}button:active{transform:scale(.97)}#browserHeader{height:var(--header-h);display:flex;align-items:center;gap:5px;padding:5px 6px;background:#17191f;border-bottom:1px solid var(--line);position:relative;z-index:20}#tabsBar{display:flex;align-items:flex-end;height:100%;min-width:0;overflow-x:auto;gap:3px;flex:1;scrollbar-width:none}#tabsBar::-webkit-scrollbar{display:none}.tab{height:39px;min-width:82px;max-width:150px;padding:0 7px 0 10px;display:flex;align-items:center;gap:6px;border:1px solid #30343e;border-bottom:0;border-radius:13px 13px 0 0;background:#20232b;color:#aeb4bf;flex:none}.tab.active{background:#30343e;color:#fff}.tabTitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.tabClose{width:24px;min-width:24px;height:24px;min-height:24px;padding:0;border:0;background:transparent}#newTabBtn{width:36px;min-width:36px;border:0;background:transparent;font-size:21px}#browserMain{position:relative;width:100%;height:calc(100% - var(--header-h));overflow:hidden;background:#000}#screenSurface{position:absolute;inset:0;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}#screenStream{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;-webkit-touch-callout:none}#touchLayer{position:absolute;inset:0;z-index:2;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}#status{position:absolute;left:7px;bottom:7px;z-index:10;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.62);font-size:10px;pointer-events:none;max-width:calc(100% - 14px)}#miniToolButton{position:fixed;right:10px;bottom:10px;z-index:50;width:45px;height:45px;border-radius:50%;padding:0;font-size:20px;background:rgba(28,31,39,.95);box-shadow:0 5px 20px rgba(0,0,0,.4)}#toolPanel,#settingsPanel{position:fixed;z-index:49;background:rgba(25,28,35,.98);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 10px 35px rgba(0,0,0,.5);zoom:var(--ui-scale);overflow:auto;max-height:calc(100vh - 75px)}#toolPanel{right:10px;bottom:10px;width:min(330px,calc(100vw - 20px))}#toolPanel.hidden{display:none}.toolDrag{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;color:var(--muted)}.toolGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.toolGrid button{min-height:38px;padding:0 5px;font-size:12px}.toolWide{grid-column:span 2}#settingsPanel{left:10px;bottom:10px;width:min(360px,calc(100vw - 20px));display:none}.settingRow{margin:10px 0}.settingRow label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.settingRow input[type=range],.settingRow select{width:100%}select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;min-height:36px}.statBox{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.stat{background:#20242d;border:1px solid #303541;border-radius:10px;padding:7px}.stat b{display:block;font-size:15px}.stat span,.storageState{color:var(--muted);font-size:10px}.storageActions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}#keyboardInput{position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;opacity:.01}@media(max-width:600px){.tab{min-width:82px;max-width:135px}}
</style></head><body>
<header id="browserHeader"><div id="tabsBar"></div><button id="newTabBtn">+</button></header><main id="browserMain"><div id="screenSurface"><img id="screenStream" alt="Remote Chromium screen" draggable="false"><div id="touchLayer"></div></div><div id="status">Connecting…</div></main><button id="miniToolButton">☰</button>
<section id="toolPanel" class="hidden"><div class="toolDrag"><span>Browser tools</span><span>⋮⋮</span></div><div class="toolGrid"><button id="backBtn">←</button><button id="forwardBtn">→</button><button id="reloadBtn">↻</button><button id="homeBtn">⌂</button><button id="stopBtn">■</button><button id="newTabTool">＋ Tab</button><button id="closeTabTool">× Tab</button><button id="settingsBtn">⚙</button><button id="copyBtn" class="toolWide">Copy</button><button id="cutBtn" class="toolWide">Cut</button><button id="pasteBtn" class="toolWide">Paste</button><button id="keyboardBtn" class="toolWide">Keyboard</button><button id="scrollUpBtn">↑ Scroll</button><button id="scrollDownBtn">↓ Scroll</button><button id="rightClickBtn">Right click</button><button id="fullscreenBtn">Fullscreen</button><button id="backupBtn" class="toolWide">☁ Backup</button><button id="restoreBtn" class="toolWide">↶ Restore</button><button id="debugBtn" class="toolWide">Debug: OFF</button><button id="collapseBtn" class="toolWide">Minimize</button></div></section>
<section id="settingsPanel"><h3 style="margin:0 0 8px;font-size:15px">Stream & UI settings</h3><div class="settingRow"><label>Format <b id="formatValue">PNG</b></label><select id="format"><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="webp">WebP</option></select></div><div class="settingRow"><label>Quality <b id="qualityValue">70</b></label><input id="quality" type="range" min="10" max="100" step="5" value="70"></div><div class="settingRow"><label>Frame interval <b id="intervalValue">180 ms</b></label><input id="interval" type="range" min="30" max="1000" step="10" value="180"></div><div class="settingRow"><label>Remote width <b id="widthValue">854</b></label><input id="width" type="range" min="320" max="1280" step="16" value="854"></div><div class="settingRow"><label>Remote height <b id="heightValue">480</b></label><input id="height" type="range" min="240" max="900" step="16" value="480"></div><div class="settingRow"><label>UI scale <b id="uiScaleValue">100%</b></label><input id="uiScale" type="range" min="70" max="120" step="5" value="100"></div><div class="settingRow"><label>Long press <b id="longPressValue">Right click</b></label><select id="longPress"><option value="right_click">Right click</option><option value="none">None</option></select></div><div class="settingRow"><label>Scroll sensitivity <b id="scrollValue">1.5×</b></label><input id="scrollSensitivity" type="range" min="0.5" max="3" step="0.1" value="1.5"></div><div class="statBox"><div class="stat"><b id="fps">—</b><span>server FPS</span></div><div class="stat"><b id="rtt">—</b><span>stats RTT</span></div><div class="stat"><b id="ram">—</b><span>container RAM</span></div><div class="stat"><b id="cpu">—</b><span>container CPU</span></div><div class="stat"><b id="frame">—</b><span>frame size</span></div><div class="stat"><b id="encode">—</b><span>capture/encode</span></div><div class="stat"><b id="chromeRam">—</b><span>Chromium RAM</span></div><div class="stat"><b id="actionRtt">—</b><span>last action RTT</span></div></div><div class="storageActions"><button id="backupBtn2">☁ Backup now</button><button id="restoreBtn2">↶ Restore</button></div><div class="storageState">Local: <span id="storageText">checking…</span></div><div class="storageState">Cloud: <span id="cloudText">checking…</span></div></section>
<textarea id="keyboardInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<script>
const $=id=>document.getElementById(id),stream=$('screenStream'),surface=$('screenSurface'),layer=$('touchLayer'),status=$('status');let tabs=[],activeIndex=0,lp=null,start=null,last=null,moved=false,actionRTT=null,typeQueue='',typeTimer=null;let scrollSensitivity=+localStorage.getItem('scrollSensitivity')||1.5,longPressMode=localStorage.getItem('longPress')||'right_click';
function setStatus(x){status.textContent=x}function api(p,o={}){return fetch(p,{cache:'no-store',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}})}function post(p,b={}){return api(p,{method:'POST',body:JSON.stringify(b)}).then(r=>r.json())}async function act(p,b={}){let s=performance.now();try{let d=await post(p,b);actionRTT=performance.now()-s;if(d.status==='error')setStatus('Error: '+(d.message||'request failed'));return d}catch(e){actionRTT=performance.now()-s;setStatus('Network error');throw e}}
function renderTabs(){let bar=$('tabsBar');bar.innerHTML='';tabs.forEach((t,i)=>{let e=document.createElement('div');e.className='tab'+(i===activeIndex?' active':'');let icon=document.createElement('span');icon.textContent='🌐';let title=document.createElement('div');title.className='tabTitle';title.textContent=t.title||t.url||'New Tab';let c=document.createElement('button');c.className='tabClose';c.textContent='×';c.onclick=async x=>{x.stopPropagation();await act('/tabs/close',{index:i});refreshTabs()};e.onclick=async()=>{if(i!==activeIndex){await act('/tabs/switch',{index:i});refreshTabs()}};e.append(icon,title,c);bar.append(e)})}async function refreshTabs(){try{let d=await(await api('/tabs')).json();tabs=d.tabs||[];activeIndex=d.active_index||0;renderTabs()}catch{setStatus('Tabs unavailable')}}async function newTab(){let d=await act('/tabs/new');if(d.tabs){tabs=d.tabs;activeIndex=d.active_index||0;renderTabs()}}
$('newTabBtn').onclick=newTab;$('newTabTool').onclick=newTab;$('backBtn').onclick=()=>act('/history/back').then(refreshTabs);$('forwardBtn').onclick=()=>act('/history/forward').then(refreshTabs);$('reloadBtn').onclick=()=>act('/reload');$('homeBtn').onclick=()=>act('/home').then(refreshTabs);$('stopBtn').onclick=()=>act('/stop');$('closeTabTool').onclick=()=>act('/tabs/close',{index:activeIndex}).then(refreshTabs);
const tools=$('toolPanel');$('miniToolButton').onclick=()=>{tools.classList.remove('hidden');$('miniToolButton').style.display='none'};$('collapseBtn').onclick=()=>{tools.classList.add('hidden');$('miniToolButton').style.display='block'};$('settingsBtn').onclick=()=>{$('settingsPanel').style.display=$('settingsPanel').style.display==='block'?'none':'block'};
function uiScale(v){document.documentElement.style.setProperty('--ui-scale',v/100);document.documentElement.style.setProperty('--header-h',Math.round(54*v/100)+'px');$('uiScaleValue').textContent=v+'%';localStorage.setItem('uiScale',v)}$('uiScale').value=+localStorage.getItem('uiScale')||100;uiScale(+$('uiScale').value);$('uiScale').oninput=e=>uiScale(+e.target.value);$('longPress').value=longPressMode;$('longPress').onchange=e=>{longPressMode=e.target.value;localStorage.setItem('longPress',longPressMode);$('longPressValue').textContent=longPressMode==='right_click'?'Right click':'None'};$('scrollSensitivity').value=scrollSensitivity;$('scrollSensitivity').oninput=e=>{scrollSensitivity=+e.target.value;$('scrollValue').textContent=scrollSensitivity.toFixed(1)+'×';localStorage.setItem('scrollSensitivity',scrollSensitivity)};
async function loadSettings(){try{let s=(await(await api('/settings')).json()).settings||{};for(let k of ['format','quality','interval','width','height'])$(k).value=s[k]??$(k).value;labels()}catch{}}function labels(){$('formatValue').textContent=$('format').value.toUpperCase();$('qualityValue').textContent=$('quality').value;$('intervalValue').textContent=$('interval').value+' ms';$('widthValue').textContent=$('width').value;$('heightValue').textContent=$('height').value}['format','quality','interval','width','height'].forEach(id=>$(id).oninput=()=>{labels();clearTimeout(window.st);window.st=setTimeout(()=>post('/settings',{format:$('format').value,quality:+$('quality').value,interval:+$('interval').value,width:+$('width').value,height:+$('height').value}),120)});
layer.oncontextmenu=e=>e.preventDefault();surface.oncontextmenu=e=>e.preventDefault();layer.ondragstart=e=>e.preventDefault();function coords(e){let r=surface.getBoundingClientRect(),w=+$('width').value,h=+$('height').value;return{x:Math.max(0,Math.min(w-1,(e.clientX-r.left)/r.width*w)),y:Math.max(0,Math.min(h-1,(e.clientY-r.top)/r.height*h))}}function clickRemote(e,a='click'){let p=coords(e);return act('/touch',{x:p.x,y:p.y,action:a})}
layer.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();try{layer.setPointerCapture(e.pointerId)}catch{}start={x:e.clientX,y:e.clientY};last=start;moved=false;clearTimeout(lp);if(longPressMode==='right_click')lp=setTimeout(()=>{if(start&&!moved){clickRemote(e,'right_click');start=null}},650)};let sp=null,st=null;function scrollQ(dx,dy){sp={dx:(sp?.dx||0)+dx,dy:(sp?.dy||0)+dy};if(st)return;st=setTimeout(()=>{let d=sp;sp=null;st=null;if(d)act('/touch',{x:0,y:0,action:'scroll',delta_x:d.dx*scrollSensitivity,delta_y:d.dy*scrollSensitivity})},45)}layer.onpointermove=e=>{if(!start)return;e.preventDefault();let dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(e.clientX-start.x)>7||Math.abs(e.clientY-start.y)>7){moved=true;clearTimeout(lp)}if(e.pointerType==='touch'&&moved)scrollQ(-dx,-dy);last={x:e.clientX,y:e.clientY}};layer.onpointerup=async e=>{if(!start)return;e.preventDefault();clearTimeout(lp);let m=moved;start=last=null;if(!m)await clickRemote(e)};layer.onpointercancel=()=>{clearTimeout(lp);start=last=null};
$('scrollUpBtn').onclick=()=>act('/touch',{x:0,y:0,action:'scroll',delta_y:-600});$('scrollDownBtn').onclick=()=>act('/touch',{x:0,y:0,action:'scroll',delta_y:600});$('rightClickBtn').onclick=()=>act('/touch',{x:+$('width').value/2,y:+$('height').value/2,action:'right_click'});
let ki=$('keyboardInput');$('keyboardBtn').onclick=()=>{ki.value='';ki.focus();setStatus('Keyboard ready')};function queueText(t){if(!t)return;typeQueue+=t;clearTimeout(typeTimer);typeTimer=setTimeout(async()=>{let x=typeQueue;typeQueue='';if(x)await act('/type',{text:x})},35)}ki.onbeforeinput=e=>{if(e.isComposing)return;if(e.inputType==='insertText'&&e.data){e.preventDefault();queueText(e.data)}else if(e.inputType==='insertLineBreak'){e.preventDefault();act('/key',{key:'Enter'})}else if(e.inputType==='deleteContentBackward'){e.preventDefault();act('/key',{key:'Backspace'})}else if(e.inputType==='deleteContentForward'){e.preventDefault();act('/key',{key:'Delete'})}};ki.oninput=e=>{if(!e.isComposing&&ki.value){let v=ki.value;ki.value='';queueText(v)}};ki.oncompositionend=e=>{if(e.data)queueText(e.data);ki.value=''};
async function clipWrite(t){if(!navigator.clipboard)throw Error('Clipboard API unavailable');await navigator.clipboard.writeText(t||'')}async function clipRead(){if(!navigator.clipboard)throw Error('Clipboard API unavailable');return navigator.clipboard.readText()}$('copyBtn').onclick=async()=>{try{let d=await(await api('/selection')).json();await clipWrite(d.text);setStatus('Copied to device clipboard')}catch(e){setStatus('Copy failed: '+e.message)}};$('cutBtn').onclick=async()=>{try{let d=await act('/cut');await clipWrite(d.text);setStatus('Cut to device clipboard')}catch(e){setStatus('Cut failed: '+e.message)}};$('pasteBtn').onclick=async()=>{try{let t=await clipRead();if(t)await act('/type',{text:t});setStatus('Pasted from device clipboard')}catch(e){setStatus('Paste failed: '+e.message)}};$('fullscreenBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{setStatus('Fullscreen unavailable')}};
$('debugBtn').onclick=()=>{window.debug=!window.debug;$('debugBtn').textContent='Debug: '+(window.debug?'ON':'OFF')};setInterval(()=>{if(window.debug)status.textContent=`tabs=${tabs.length} active=${activeIndex} size=${$('width').value}x${$('height').value} format=${$('format').value}`},500);
async function stats(){try{let d=await(await api('/stats')).json();$('fps').textContent=d.server_fps+' fps';$('rtt').textContent='ok';$('ram').textContent=(d.ram_mb??'—')+' / '+(d.ram_limit_mb??'?')+' MB';$('cpu').textContent=d.cpu_percent==null?'—':d.cpu_percent+'%';$('frame').textContent=d.frame_kb+' KB';$('encode').textContent=d.encode_ms+' ms';$('chromeRam').textContent=d.chromium_ram_mb+' MB';$('actionRtt').textContent=actionRTT==null?'—':Math.round(actionRTT)+' ms'}catch{$('rtt').textContent='offline'}}async function localStorageInfo(){try{let d=await(await api('/storage')).json();$('storageText').textContent=d.exists?`${d.size_mb} MB • ${d.files} files`:'not available'}catch{}}async function cloud(){try{let d=await(await api('/backup/status')).json();$('cloudText').textContent=!d.configured?'not configured':d.busy?'working…':d.last_error?'error: '+d.last_error.slice(0,60):d.last_backup?'backup '+d.last_backup+' • '+d.size_mb+' MB':'connected • no backup'}catch{$('cloudText').textContent='unavailable'}}async function backup(){setStatus('Cloud backup starting…');let d=await post('/backup');setStatus(d.status==='started'?'Backup started':d.message||'Backup error');setTimeout(cloud,1200)}async function restore(){if(!confirm('Restore will replace the current remote Chromium profile. Continue?'))return;setStatus('Restoring profile…');let d=await post('/restore');setStatus(d.message||d.status);stream.src='/screen?ts='+Date.now();refreshTabs();cloud()}$('backupBtn').onclick=backup;$('backupBtn2').onclick=backup;$('restoreBtn').onclick=restore;$('restoreBtn2').onclick=restore;
function reconnect(){stream.src='/screen?ts='+Date.now()}stream.src='/screen?ts='+Date.now();stream.onerror=()=>{setStatus('Stream error — reconnecting…');setTimeout(reconnect,1000)};loadSettings();refreshTabs();stats();localStorageInfo();cloud();setInterval(stats,1000);setInterval(refreshTabs,2500);setInterval(cloud,5000);setInterval(localStorageInfo,5000);
</script></body></html>
